name: Host checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare locked host dependency
        run: |
          python3 -m pip install idf-component-manager==3.0.3
          python3 scripts/firmware/prepare_host_dependencies.py
      - name: Run the shared host entry point
        run: python3 scripts/check.py --diagrams
