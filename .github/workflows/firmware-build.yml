name: Firmware build

on:
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"
      - "scripts/firmware/*patched*.py"
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware-build.yml"
      - "scripts/firmware/*patched*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.0.1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Configure board and build firmware
        run: |
          source /opt/esp/idf/export.sh
          idf.py -C firmware set-target esp32s3
          idf.py -C firmware reconfigure
          board_path="$GITHUB_WORKSPACE/firmware/managed_components/espressif__brookesia_hal_boards/boards/waveshare/esp32_s3_touch_amoled_1_75c"
          idf.py -C firmware gen-bmgr-config -b "$board_path"
          python3 scripts/firmware/build_patched_firmware.py --workspace "$RUNNER_TEMP/espocket-patched-build" --sdkconfig firmware/sdkconfig
      - uses: actions/upload-artifact@v4
        with:
          name: espocket-firmware
          path: |
            ${{ runner.temp }}/espocket-patched-build/firmware/build/espocket.bin
            ${{ runner.temp }}/espocket-patched-build/firmware/build/espocket.elf
            ${{ runner.temp }}/espocket-patched-build/firmware/build/littlefs_data.bin
            ${{ runner.temp }}/espocket-patched-build/firmware/build/bootloader/bootloader.bin
            ${{ runner.temp }}/espocket-patched-build/firmware/build/partition_table/partition-table.bin
            ${{ runner.temp }}/espocket-patched-build/firmware/sdkconfig
            ${{ runner.temp }}/espocket-patched-build/patch-inputs.json
            ${{ runner.temp }}/espocket-patched-build/firmware/dependencies.lock
