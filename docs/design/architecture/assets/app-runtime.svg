<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 650"><title id="title">ESPocket 应用运行模型</title><desc id="desc">Native IApp 与 Runtime JS package 通过不同 Adapter 接入同一个 System Core 生命周期、导航与 AppContext 契约。</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="var(--grid)"/></pattern><marker id="arrow-direct" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-event" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-package" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>
  svg{--paper:#f3f6f9;--surface:#fff;--surface-soft:#f8fafc;--ink:#182b3d;--muted:#667b8e;--rule:#c7d2dc;--grid:rgba(48,78,103,.045);--blue:#1974c8;--blue-soft:#edf6ff;--teal:#178873;--teal-soft:#eef9f6;--amber:#a56d1d;--amber-soft:#fbf7ef;--danger:#b04f45;--danger-soft:#fdf1ef;--edge:#71879a;background:var(--paper);color-scheme:light}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:var(--ink)}
  .sheet{fill:var(--paper)}.grid{fill:url(#grid)}
  .doc-kicker{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.7px;fill:var(--blue)}
  .doc-title{font-size:28px;font-weight:600;letter-spacing:-.7px}.doc-subtitle{font-size:13px;fill:var(--muted)}
  .legend-text{font-size:11px;fill:var(--muted)}.legend-line{stroke:var(--edge);stroke-width:1.4}.legend-line.event{stroke-dasharray:5 5}.legend-line.package{stroke:var(--amber);stroke-dasharray:2 5}
  .band rect{fill:rgba(255,255,255,.86);stroke:var(--rule);stroke-width:1}.band.product rect{fill:rgba(237,246,255,.7);stroke:#a8c5de}.band.framework rect{fill:rgba(238,249,246,.78);stroke:#acd1c9}.band.platform rect{fill:rgba(251,247,239,.82);stroke:#d8c5a6}.band.danger rect{fill:var(--danger-soft);stroke:#dfb5b0}
  .band-title{font-size:15px;font-weight:600}.band-meta{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:var(--muted)}
  .node rect{fill:var(--surface);stroke:#aebdca;stroke-width:1}.node.product rect{fill:var(--blue-soft);stroke:#79a8d1}.node.focus-product rect{fill:#e7f3ff;stroke:var(--blue);stroke-width:1.6}.node.framework rect{fill:var(--teal-soft);stroke:#7eb9ad}.node.focus-framework rect{fill:#e7f7f3;stroke:var(--teal);stroke-width:1.6}.node.platform rect{fill:var(--amber-soft);stroke:#c5a77a}.node.danger rect{fill:var(--danger-soft);stroke:#d79a94}
  .eyebrow{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.2px;fill:var(--muted)}.node-title{font-size:14px;font-weight:600}.detail{font:400 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}
  .chip rect{fill:var(--surface);stroke:#b6c4cf;stroke-width:1}.chip.product rect{fill:var(--blue-soft);stroke:#91b5d5}.chip.framework rect{fill:var(--teal-soft);stroke:#8ebeb5}.chip.platform rect{fill:var(--amber-soft);stroke:#c8ae85}.chip.danger rect{fill:var(--danger-soft);stroke:#d5a39e}.chip-title{font-size:11px;font-weight:600}.chip-meta{font:400 9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}
  .edge{fill:none;stroke:var(--edge);stroke-width:1.35}.edge.direct{marker-end:url(#arrow-direct)}.edge.event{stroke-dasharray:5 5;marker-end:url(#arrow-event)}.edge.package{stroke:var(--amber);stroke-dasharray:2 5;marker-end:url(#arrow-package)}.edge.strong{stroke:var(--blue);stroke-width:1.65;marker-end:url(#arrow-strong)}.edge.safe{stroke:var(--teal);marker-end:url(#arrow-safe)}.edge.fail{stroke:var(--danger);stroke-dasharray:5 5;marker-end:url(#arrow-fail)}
  .edge-text{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}.edge-text.package{fill:var(--amber)}.edge-text.strong{fill:var(--blue)}.edge-text.safe{fill:var(--teal)}.edge-text.fail{fill:var(--danger)}
  .lane{stroke:#b9c6d0;stroke-width:1;stroke-dasharray:3 5}.lane-head rect{fill:var(--surface);stroke:var(--rule)}.lane-head.product rect{fill:var(--blue-soft);stroke:#91b5d5}.lane-head.framework rect{fill:var(--teal-soft);stroke:#8ebeb5}.lane-title{font-size:12px;font-weight:600}
  .step rect{fill:var(--surface);stroke:#aebdca}.step.product rect{fill:var(--blue-soft);stroke:#79a8d1}.step.framework rect{fill:var(--teal-soft);stroke:#7eb9ad}.step.platform rect{fill:var(--amber-soft);stroke:#c5a77a}.step-num{font:500 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:var(--muted)}.step-title{font-size:12px;font-weight:600}.step-detail{font:400 9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}
  .section{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.4px;fill:var(--muted)}.caption{font-size:11px;fill:var(--muted)}.caption-strong{font-size:11px;font-weight:600;fill:var(--ink)}
  .state{fill:var(--surface);stroke:#aebdca;stroke-width:1.2}.state.product{fill:var(--blue-soft);stroke:var(--blue)}.state.framework{fill:var(--teal-soft);stroke:var(--teal)}.state.platform{fill:var(--amber-soft);stroke:var(--amber)}.state-title{font-size:14px;font-weight:600}.state-detail{font-size:10px;fill:var(--muted)}
</style><rect class="sheet" width="1200" height="650"/><rect class="grid" width="1200" height="650"/><text class="doc-kicker" x="40" y="34" text-anchor="start">ESPOCKET · ARCHITECTURE</text><text class="doc-title" x="40" y="67" text-anchor="start">ESPocket 应用运行模型</text><text class="doc-subtitle" x="40" y="91" text-anchor="start">Native 与 Runtime 使用不同 Adapter，跨越同一个 System Core seam</text><g aria-label="连线图例"><line class="legend-line" x1="870" y1="62" x2="894" y2="62"/><text class="legend-text" x="902" y="66" text-anchor="start">调用 / 依赖</text><line class="legend-line event" x1="986" y1="62" x2="1010" y2="62"/><text class="legend-text" x="1018" y="66" text-anchor="start">事件</text><line class="legend-line package" x1="1072" y1="62" x2="1096" y2="62"/><text class="legend-text" x="1104" y="66" text-anchor="start">包加载</text></g><g class="node product"><rect x="55" y="235" width="210" height="100" rx="4"/><text class="eyebrow" x="69" y="254" text-anchor="start">SHELL</text><text class="node-title" x="69" y="277" text-anchor="start">Home Space</text><text class="detail" x="69" y="296" text-anchor="start"><tspan x="69" dy="0">Launcher · Card</tspan><tspan x="69" dy="16">Quick Settings</tspan></text></g><g class="node focus-product"><rect x="325" y="220" width="250" height="130" rx="4"/><text class="eyebrow" x="339" y="239" text-anchor="start">PRODUCT POLICY</text><text class="node-title" x="339" y="262" text-anchor="start">espocket::System</text><text class="detail" x="339" y="281" text-anchor="start"><tspan x="339" dy="0">manifest → app_id</tspan><tspan x="339" dy="16">Page stack · Home</tspan></text></g><g class="node focus-framework"><rect x="635" y="195" width="300" height="180" rx="4"/><text class="eyebrow" x="649" y="214" text-anchor="start">RUNTIME SEAM</text><text class="node-title" x="649" y="237" text-anchor="start">System Core</text><text class="detail" x="649" y="256" text-anchor="start"><tspan x="649" dy="0">single AppState machine</tspan></text></g><g class="chip framework"><rect x="660" y="255" width="120" height="36" rx="3"/><text class="chip-title" x="671" y="271" text-anchor="start">App Manager</text><text class="chip-meta" x="671" y="284" text-anchor="start">lifecycle</text></g><g class="chip framework"><rect x="790" y="255" width="120" height="36" rx="3"/><text class="chip-title" x="801" y="271" text-anchor="start">AppContext</text><text class="chip-meta" x="801" y="284" text-anchor="start">GUI · Timer</text></g><g class="chip framework"><rect x="660" y="305" width="250" height="36" rx="3"/><text class="chip-title" x="671" y="321" text-anchor="start">Keyboard request</text><text class="chip-meta" x="671" y="334" text-anchor="start">System hook → Shell overlay</text></g><g class="band neutral"><rect x="985" y="125" width="180" height="150" rx="6"/><text class="band-title" x="1003" y="151" text-anchor="start">Native path</text><text class="band-meta" x="1003" y="169" text-anchor="start">IApp</text></g><g class="chip product"><rect x="1005" y="178" width="140" height="36" rx="3"/><text class="chip-title" x="1016" y="194" text-anchor="start">Hello Native</text><text class="chip-meta" x="1016" y="207" text-anchor="start">product</text></g><g class="chip neutral"><rect x="1005" y="222" width="140" height="36" rx="3"/><text class="chip-title" x="1016" y="238" text-anchor="start">Settings / Store</text><text class="chip-meta" x="1016" y="251" text-anchor="start">official</text></g><g class="band platform"><rect x="985" y="330" width="180" height="190" rx="6"/><text class="band-title" x="1003" y="356" text-anchor="start">Runtime path</text><text class="band-meta" x="1003" y="374" text-anchor="start">PACKAGE</text></g><g class="chip platform"><rect x="1005" y="382" width="140" height="36" rx="3"/><text class="chip-title" x="1016" y="398" text-anchor="start">Package Manager</text><text class="chip-meta" x="1016" y="411" text-anchor="start">LittleFS /apps</text></g><g class="chip platform"><rect x="1005" y="426" width="140" height="36" rx="3"/><text class="chip-title" x="1016" y="442" text-anchor="start">Runtime JS</text><text class="chip-meta" x="1016" y="455" text-anchor="start">QuickJS backend</text></g><g class="chip platform"><rect x="1005" y="470" width="140" height="36" rx="3"/><text class="chip-title" x="1016" y="486" text-anchor="start">Hello Runtime</text><text class="chip-meta" x="1016" y="499" text-anchor="start">manifest + JS</text></g><path class="edge strong" d="M265 285H325" marker-end="url(#arrow-strong)"/><text class="edge-text strong" x="273" y="275" text-anchor="start">launch</text><path class="edge strong" d="M575 285H635" marker-end="url(#arrow-strong)"/><text class="edge-text strong" x="581" y="275" text-anchor="start">start / stop</text><path class="edge direct" d="M935 245H985" marker-end="url(#arrow-direct)"/><text class="edge-text direct" x="945" y="235" text-anchor="start">IApp</text><path class="edge package" d="M935 340H955V425H985" marker-end="url(#arrow-package)"/><path class="edge event" d="M985 470H945V360H935" marker-end="url(#arrow-event)"/><g class="band framework"><rect x="325" y="430" width="610" height="102" rx="6"/><text class="band-title" x="343" y="456" text-anchor="start">共同契约</text><text class="band-meta" x="343" y="474" text-anchor="start">SAME PRODUCT BEHAVIOR</text></g><g class="chip framework"><rect x="350" y="475" width="170" height="36" rx="3"/><text class="chip-title" x="361" y="491" text-anchor="start">统一生命周期</text><text class="chip-meta" x="361" y="504" text-anchor="start">Installed → Running → Stopped</text></g><g class="chip framework"><rect x="535" y="475" width="170" height="36" rx="3"/><text class="chip-title" x="546" y="491" text-anchor="start">统一导航</text><text class="chip-meta" x="546" y="504" text-anchor="start">Page · Back · Home</text></g><g class="chip framework"><rect x="720" y="475" width="190" height="36" rx="3"/><text class="chip-title" x="731" y="491" text-anchor="start">统一 GUI / Keyboard</text><text class="chip-meta" x="731" y="504" text-anchor="start">AppContext interface</text></g><path class="edge safe" d="M785 375V430" marker-end="url(#arrow-safe)"/><text class="edge-text safe" x="797" y="420" text-anchor="start">shared contract</text><text class="caption-strong" x="325" y="575" text-anchor="start">包信任决定 Runtime 是否可安装；安装后不再维护第二套产品导航。</text></svg>
