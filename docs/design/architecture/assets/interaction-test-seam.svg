<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 620"><title id="title">ESPocket 交互自动化 Seam</title><desc id="desc">主机经 USB Test Adapter 在开发者模式准入后驱动 Display、Shell 和 System，并从 App Navigator 读取 Page 状态；合成输入与物理、视觉证据分开。</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="var(--grid)"/></pattern><marker id="arrow-direct" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-event" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-package" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>
  svg{--paper:#f3f6f9;--surface:#fff;--surface-soft:#f8fafc;--ink:#182b3d;--muted:#667b8e;--rule:#c7d2dc;--grid:rgba(48,78,103,.045);--blue:#1974c8;--blue-soft:#edf6ff;--teal:#178873;--teal-soft:#eef9f6;--amber:#a56d1d;--amber-soft:#fbf7ef;--danger:#b04f45;--danger-soft:#fdf1ef;--edge:#71879a;background:var(--paper);color-scheme:light}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:var(--ink)}
  .sheet{fill:var(--paper)}.grid{fill:url(#grid)}
  .doc-kicker{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.7px;fill:var(--blue)}
  .doc-title{font-size:28px;font-weight:600;letter-spacing:-.7px}.doc-subtitle{font-size:13px;fill:var(--muted)}
  .legend-text{font-size:11px;fill:var(--muted)}.legend-line{stroke:var(--edge);stroke-width:1.4}.legend-line.event{stroke-dasharray:5 5}.legend-line.package{stroke:var(--amber);stroke-dasharray:2 5}
  .band rect{fill:rgba(255,255,255,.86);stroke:var(--rule);stroke-width:1}.band.product rect{fill:rgba(237,246,255,.7);stroke:#a8c5de}.band.framework rect{fill:rgba(238,249,246,.78);stroke:#acd1c9}.band.platform rect{fill:rgba(251,247,239,.82);stroke:#d8c5a6}.band.danger rect{fill:var(--danger-soft);stroke:#dfb5b0}
  .band-title{font-size:15px;font-weight:600}.band-meta{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:var(--muted)}
  .node rect{fill:var(--surface);stroke:#aebdca;stroke-width:1}.node.product rect{fill:var(--blue-soft);stroke:#79a8d1}.node.focus-product rect{fill:#e7f3ff;stroke:var(--blue);stroke-width:1.6}.node.framework rect{fill:var(--teal-soft);stroke:#7eb9ad}.node.focus-framework rect{fill:#e7f7f3;stroke:var(--teal);stroke-width:1.6}.node.platform rect{fill:var(--amber-soft);stroke:#c5a77a}.node.danger rect{fill:var(--danger-soft);stroke:#d79a94}
  .eyebrow{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.2px;fill:var(--muted)}.node-title{font-size:14px;font-weight:600}.detail{font:400 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}
  .chip rect{fill:var(--surface);stroke:#b6c4cf;stroke-width:1}.chip.product rect{fill:var(--blue-soft);stroke:#91b5d5}.chip.framework rect{fill:var(--teal-soft);stroke:#8ebeb5}.chip.platform rect{fill:var(--amber-soft);stroke:#c8ae85}.chip.danger rect{fill:var(--danger-soft);stroke:#d5a39e}.chip-title{font-size:11px;font-weight:600}.chip-meta{font:400 9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}
  .edge{fill:none;stroke:var(--edge);stroke-width:1.35}.edge.direct{marker-end:url(#arrow-direct)}.edge.event{stroke-dasharray:5 5;marker-end:url(#arrow-event)}.edge.package{stroke:var(--amber);stroke-dasharray:2 5;marker-end:url(#arrow-package)}.edge.strong{stroke:var(--blue);stroke-width:1.65;marker-end:url(#arrow-strong)}.edge.safe{stroke:var(--teal);marker-end:url(#arrow-safe)}.edge.fail{stroke:var(--danger);stroke-dasharray:5 5;marker-end:url(#arrow-fail)}
  .edge-text{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}.edge-text.package{fill:var(--amber)}.edge-text.strong{fill:var(--blue)}.edge-text.safe{fill:var(--teal)}.edge-text.fail{fill:var(--danger)}
  .lane{stroke:#b9c6d0;stroke-width:1;stroke-dasharray:3 5}.lane-head rect{fill:var(--surface);stroke:var(--rule)}.lane-head.product rect{fill:var(--blue-soft);stroke:#91b5d5}.lane-head.framework rect{fill:var(--teal-soft);stroke:#8ebeb5}.lane-title{font-size:12px;font-weight:600}
  .step rect{fill:var(--surface);stroke:#aebdca}.step.product rect{fill:var(--blue-soft);stroke:#79a8d1}.step.framework rect{fill:var(--teal-soft);stroke:#7eb9ad}.step.platform rect{fill:var(--amber-soft);stroke:#c5a77a}.step-num{font:500 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:var(--muted)}.step-title{font-size:12px;font-weight:600}.step-detail{font:400 9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}
  .section{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.4px;fill:var(--muted)}.caption{font-size:11px;fill:var(--muted)}.caption-strong{font-size:11px;font-weight:600;fill:var(--ink)}
  .state{fill:var(--surface);stroke:#aebdca;stroke-width:1.2}.state.product{fill:var(--blue-soft);stroke:var(--blue)}.state.framework{fill:var(--teal-soft);stroke:var(--teal)}.state.platform{fill:var(--amber-soft);stroke:var(--amber)}.state-title{font-size:14px;font-weight:600}.state-detail{font-size:10px;fill:var(--muted)}
</style><rect class="sheet" width="1200" height="620"/><rect class="grid" width="1200" height="620"/><text class="doc-kicker" x="40" y="34" text-anchor="start">ESPOCKET · ARCHITECTURE</text><text class="doc-title" x="40" y="67" text-anchor="start">ESPocket 交互自动化 Seam</text><text class="doc-subtitle" x="40" y="91" text-anchor="start">USB 刺激与只读快照穿过同一产品 Owner</text><g aria-label="连线图例"><line class="legend-line" x1="870" y1="62" x2="894" y2="62"/><text class="legend-text" x="902" y="66" text-anchor="start">调用 / 依赖</text><line class="legend-line event" x1="986" y1="62" x2="1010" y2="62"/><text class="legend-text" x="1018" y="66" text-anchor="start">事件</text><line class="legend-line package" x1="1072" y1="62" x2="1096" y2="62"/><text class="legend-text" x="1104" y="66" text-anchor="start">包加载</text></g><g class="node neutral"><rect x="45" y="190" width="210" height="100" rx="4"/><text class="eyebrow" x="59" y="209" text-anchor="start">USB CLIENT</text><text class="node-title" x="59" y="232" text-anchor="start">Host Test Driver</text><text class="detail" x="59" y="251" text-anchor="start"><tspan x="59" dy="0">case · wait · assert</tspan><tspan x="59" dy="16">evidence type</tspan></text></g><g class="node focus-product"><rect x="330" y="165" width="250" height="150" rx="4"/><text class="eyebrow" x="344" y="184" text-anchor="start">PRODUCT SEAM</text><text class="node-title" x="344" y="207" text-anchor="start">ESPocket Test Adapter</text><text class="detail" x="344" y="226" text-anchor="start"><tspan x="344" dy="0">developer mode gate</tspan><tspan x="344" dy="16">stimulus · snapshot · release</tspan></text></g><g class="node product"><rect x="650" y="145" width="210" height="82" rx="4"/><text class="eyebrow" x="664" y="164" text-anchor="start">INPUT OWNER</text><text class="node-title" x="664" y="187" text-anchor="start">Display / Shell</text><text class="detail" x="664" y="206" text-anchor="start"><tspan x="664" dy="0">touch · Home Space</tspan></text></g><g class="node product"><rect x="650" y="255" width="210" height="82" rx="4"/><text class="eyebrow" x="664" y="274" text-anchor="start">SYSTEM OWNER</text><text class="node-title" x="664" y="297" text-anchor="start">System</text><text class="detail" x="664" y="316" text-anchor="start"><tspan x="664" dy="0">PWR · display · app</tspan></text></g><g class="node product"><rect x="650" y="365" width="210" height="82" rx="4"/><text class="eyebrow" x="664" y="384" text-anchor="start">PAGE OWNER</text><text class="node-title" x="664" y="407" text-anchor="start">App Navigator</text><text class="detail" x="664" y="426" text-anchor="start"><tspan x="664" dy="0">Page ID · Back state</tspan></text></g><g class="node framework"><rect x="930" y="255" width="220" height="82" rx="4"/><text class="eyebrow" x="944" y="274" text-anchor="start">APP OWNER</text><text class="node-title" x="944" y="297" text-anchor="start">Native / Runtime App</text><text class="detail" x="944" y="316" text-anchor="start"><tspan x="944" dy="0">content · Back decision</tspan></text></g><path class="edge strong" d="M255 240H330" marker-end="url(#arrow-strong)"/><text class="edge-text strong" x="268" y="230" text-anchor="start">USB protocol</text><path class="edge safe" d="M580 205H615V186H650" marker-end="url(#arrow-safe)"/><text class="edge-text safe" x="592" y="176" text-anchor="start">touch</text><path class="edge safe" d="M580 240H650" marker-end="url(#arrow-safe)"/><text class="edge-text safe" x="604" y="230" text-anchor="start">PWR</text><path class="edge event" d="M580 275H615V406H650" marker-end="url(#arrow-event)"/><path class="edge direct" d="M860 296H930" marker-end="url(#arrow-direct)"/><text class="edge-text direct" x="869" y="286" text-anchor="start">App events</text><path class="edge event" d="M930 385H895V406H860" marker-end="url(#arrow-event)"/><text class="edge-text event" x="883" y="375" text-anchor="start">Back / Page</text><g class="band platform"><rect x="45" y="500" width="1105" height="68" rx="6"/><text class="band-title" x="63" y="526" text-anchor="start">证据边界</text><text class="band-meta" x="63" y="544" text-anchor="start">SYNTHETIC INPUT ≠ PHYSICAL INPUT ≠ VISUAL PROOF</text></g></svg>
