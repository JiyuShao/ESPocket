<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1280 770"><title id="title">ESPocket AI Native 目标架构</title><desc id="desc">目标架构，尚未实现。Assistant 是统一逻辑入口；Context、Action、Event、Permission 横向连接现有 System、Shell、Native App、Brookesia Service 与 Runtime App Owner。每次访问检查权限，Runtime 调用遵守 Service manifest 声明和 HostBridge 准入，不建立第二套 Manager。</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="var(--grid)"/></pattern><marker id="arrow-direct" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-event" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-package" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>
  svg{--paper:#f3f6f9;--surface:#fff;--surface-soft:#f8fafc;--ink:#182b3d;--muted:#667b8e;--rule:#c7d2dc;--grid:rgba(48,78,103,.045);--blue:#1974c8;--blue-soft:#edf6ff;--teal:#178873;--teal-soft:#eef9f6;--amber:#a56d1d;--amber-soft:#fbf7ef;--danger:#b04f45;--danger-soft:#fdf1ef;--edge:#71879a;background:var(--paper);color-scheme:light}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:var(--ink)}
  .sheet{fill:var(--paper)}.grid{fill:url(#grid)}
  .doc-kicker{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.7px;fill:var(--blue)}
  .doc-title{font-size:28px;font-weight:600;letter-spacing:-.7px}.doc-subtitle{font-size:13px;fill:var(--muted)}
  .legend-text{font-size:11px;fill:var(--muted)}.legend-line{stroke:var(--edge);stroke-width:1.4}.legend-line.event{stroke-dasharray:5 5}.legend-line.package{stroke:var(--amber);stroke-dasharray:2 5}
  .band rect{fill:rgba(255,255,255,.86);stroke:var(--rule);stroke-width:1}.band.product rect{fill:rgba(237,246,255,.7);stroke:#a8c5de}.band.framework rect{fill:rgba(238,249,246,.78);stroke:#acd1c9}.band.platform rect{fill:rgba(251,247,239,.82);stroke:#d8c5a6}.band.danger rect{fill:var(--danger-soft);stroke:#dfb5b0}
  .band-title{font-size:15px;font-weight:600}.band-meta{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:var(--muted)}
  .node rect{fill:var(--surface);stroke:#aebdca;stroke-width:1}.node.product rect{fill:var(--blue-soft);stroke:#79a8d1}.node.focus-product rect{fill:#e7f3ff;stroke:var(--blue);stroke-width:1.6}.node.framework rect{fill:var(--teal-soft);stroke:#7eb9ad}.node.focus-framework rect{fill:#e7f7f3;stroke:var(--teal);stroke-width:1.6}.node.platform rect{fill:var(--amber-soft);stroke:#c5a77a}.node.danger rect{fill:var(--danger-soft);stroke:#d79a94}
  .eyebrow{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.2px;fill:var(--muted)}.node-title{font-size:14px;font-weight:600}.detail{font:400 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}
  .chip rect{fill:var(--surface);stroke:#b6c4cf;stroke-width:1}.chip.product rect{fill:var(--blue-soft);stroke:#91b5d5}.chip.framework rect{fill:var(--teal-soft);stroke:#8ebeb5}.chip.platform rect{fill:var(--amber-soft);stroke:#c8ae85}.chip.danger rect{fill:var(--danger-soft);stroke:#d5a39e}.chip-title{font-size:11px;font-weight:600}.chip-meta{font:400 9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}
  .edge{fill:none;stroke:var(--edge);stroke-width:1.35}.edge.direct{marker-end:url(#arrow-direct)}.edge.event{stroke-dasharray:5 5;marker-end:url(#arrow-event)}.edge.package{stroke:var(--amber);stroke-dasharray:2 5;marker-end:url(#arrow-package)}.edge.strong{stroke:var(--blue);stroke-width:1.65;marker-end:url(#arrow-strong)}.edge.safe{stroke:var(--teal);marker-end:url(#arrow-safe)}.edge.fail{stroke:var(--danger);stroke-dasharray:5 5;marker-end:url(#arrow-fail)}
  .edge-text{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}.edge-text.package{fill:var(--amber)}.edge-text.strong{fill:var(--blue)}.edge-text.safe{fill:var(--teal)}.edge-text.fail{fill:var(--danger)}
  .lane{stroke:#b9c6d0;stroke-width:1;stroke-dasharray:3 5}.lane-head rect{fill:var(--surface);stroke:var(--rule)}.lane-head.product rect{fill:var(--blue-soft);stroke:#91b5d5}.lane-head.framework rect{fill:var(--teal-soft);stroke:#8ebeb5}.lane-title{font-size:12px;font-weight:600}
  .step rect{fill:var(--surface);stroke:#aebdca}.step.product rect{fill:var(--blue-soft);stroke:#79a8d1}.step.framework rect{fill:var(--teal-soft);stroke:#7eb9ad}.step.platform rect{fill:var(--amber-soft);stroke:#c5a77a}.step-num{font:500 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:var(--muted)}.step-title{font-size:12px;font-weight:600}.step-detail{font:400 9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}
  .section{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.4px;fill:var(--muted)}.caption{font-size:11px;fill:var(--muted)}.caption-strong{font-size:11px;font-weight:600;fill:var(--ink)}
  .state{fill:var(--surface);stroke:#aebdca;stroke-width:1.2}.state.product{fill:var(--blue-soft);stroke:var(--blue)}.state.framework{fill:var(--teal-soft);stroke:var(--teal)}.state.platform{fill:var(--amber-soft);stroke:var(--amber)}.state-title{font-size:14px;font-weight:600}.state-detail{font-size:10px;fill:var(--muted)}
</style><rect class="sheet" width="1280" height="770"/><rect class="grid" width="1280" height="770"/><text class="doc-kicker" x="40" y="34" text-anchor="start">ESPOCKET · ARCHITECTURE</text><text class="doc-title" x="40" y="67" text-anchor="start">ESPocket AI Native 目标架构</text><text class="doc-subtitle" x="40" y="91" text-anchor="start">横向语义访问维度 × 现有状态与生命周期 Owner</text><g aria-label="连线图例"><line class="legend-line" x1="950" y1="62" x2="974" y2="62"/><text class="legend-text" x="982" y="66" text-anchor="start">调用 / 依赖</text><line class="legend-line event" x1="1066" y1="62" x2="1090" y2="62"/><text class="legend-text" x="1098" y="66" text-anchor="start">事件</text><line class="legend-line package" x1="1152" y1="62" x2="1176" y2="62"/><text class="legend-text" x="1184" y="66" text-anchor="start">包加载</text></g><g class="band platform"><rect x="40" y="120" width="1200" height="62" rx="6"/><text class="band-title" x="58" y="146" text-anchor="start">目标架构 · 尚未实现</text><text class="band-meta" x="58" y="164" text-anchor="start">TARGET / NOT IMPLEMENTED · CAPABILITY-SPECIFIC INTERSECTIONS</text></g><g class="band neutral"><rect x="40" y="215" width="270" height="455" rx="6"/><text class="band-title" x="58" y="241" text-anchor="start">请求者与逻辑入口</text><text class="band-meta" x="58" y="259" text-anchor="start">INTENT / CALLER</text></g><g class="node focus-product"><rect x="60" y="275" width="230" height="85" rx="4"/><text class="eyebrow" x="74" y="294" text-anchor="start">USER INTENT</text><text class="node-title" x="74" y="317" text-anchor="start">Assistant</text><text class="detail" x="74" y="336" text-anchor="start"><tspan x="74" dy="0">统一逻辑入口</tspan><tspan x="74" dy="16">不拥有目标状态</tspan></text></g><g class="node product"><rect x="60" y="390" width="230" height="75" rx="4"/><text class="eyebrow" x="74" y="409" text-anchor="start">DIRECT USER ACTION</text><text class="node-title" x="74" y="432" text-anchor="start">产品 UI</text><text class="detail" x="74" y="451" text-anchor="start"><tspan x="74" dy="0">共用语义 Action · 分别判权</tspan></text></g><g class="node platform"><rect x="60" y="495" width="230" height="75" rx="4"/><text class="eyebrow" x="74" y="514" text-anchor="start">THIRD-PARTY CALLER</text><text class="node-title" x="74" y="537" text-anchor="start">Runtime App 使用者</text><text class="detail" x="74" y="556" text-anchor="start"><tspan x="74" dy="0">仅经已声明的 Service</tspan></text></g><g class="band product"><rect x="340" y="215" width="395" height="455" rx="6"/><text class="band-title" x="358" y="241" text-anchor="start">AI Native 语义访问维度</text><text class="band-meta" x="358" y="259" text-anchor="start">TARGET CONTRACTS · NOT A NEW MANAGER</text></g><g class="chip product"><rect x="360" y="280" width="165" height="36" rx="3"/><text class="chip-title" x="371" y="296" text-anchor="start">Context</text><text class="chip-meta" x="371" y="309" text-anchor="start">获准可见的状态</text></g><g class="chip product"><rect x="545" y="280" width="165" height="36" rx="3"/><text class="chip-title" x="556" y="296" text-anchor="start">Action</text><text class="chip-meta" x="556" y="309" text-anchor="start">请求真实 Owner 执行</text></g><g class="chip product"><rect x="360" y="335" width="165" height="36" rx="3"/><text class="chip-title" x="371" y="351" text-anchor="start">Event</text><text class="chip-meta" x="371" y="364" text-anchor="start">Owner 已发生的事实</text></g><g class="chip product"><rect x="545" y="335" width="165" height="36" rx="3"/><text class="chip-title" x="556" y="351" text-anchor="start">Permission</text><text class="chip-meta" x="556" y="364" text-anchor="start">每次访问都需检查</text></g><g class="node focus-product"><rect x="360" y="410" width="350" height="90" rx="4"/><text class="eyebrow" x="374" y="429" text-anchor="start">EVERY ACCESS</text><text class="node-title" x="374" y="452" text-anchor="start">身份与权限链</text><text class="detail" x="374" y="471" text-anchor="start"><tspan x="374" dy="0">调用者 ∩ 产品授权 ∩ 框架准入</tspan><tspan x="374" dy="16">执行前复核；拒绝即停止</tspan></text></g><g class="node product"><rect x="360" y="525" width="350" height="72" rx="4"/><text class="eyebrow" x="374" y="544" text-anchor="start">INTEGRATION SEAM</text><text class="node-title" x="374" y="567" text-anchor="start">Adapter / Facade / Bridge</text><text class="detail" x="374" y="586" text-anchor="start"><tspan x="374" dy="0">按真实能力映射；不建第二套 Manager</tspan></text></g><g class="band framework"><rect x="765" y="215" width="475" height="455" rx="6"/><text class="band-title" x="783" y="241" text-anchor="start">真实状态与生命周期 Owner</text><text class="band-meta" x="783" y="259" text-anchor="start">CURRENT OWNERS · NO DUPLICATE STATE</text></g><g class="node product"><rect x="790" y="280" width="420" height="64" rx="4"/><text class="node-title" x="804" y="309" text-anchor="start">System / Shell</text><text class="detail" x="804" y="328" text-anchor="start"><tspan x="804" dy="0">PWR · Home · UI 与导航状态</tspan></text></g><g class="node product"><rect x="790" y="365" width="420" height="64" rx="4"/><text class="node-title" x="804" y="394" text-anchor="start">Native App</text><text class="detail" x="804" y="413" text-anchor="start"><tspan x="804" dy="0">只在一次 Running 实例内提供能力</tspan></text></g><g class="node framework"><rect x="790" y="450" width="420" height="64" rx="4"/><text class="node-title" x="804" y="479" text-anchor="start">Brookesia Service</text><text class="detail" x="804" y="498" text-anchor="start"><tspan x="804" dy="0">跨 App 生命周期持续能力的 Owner</tspan></text></g><g class="node platform"><rect x="790" y="535" width="420" height="64" rx="4"/><text class="node-title" x="804" y="564" text-anchor="start">Runtime App</text><text class="detail" x="804" y="583" text-anchor="start"><tspan x="804" dy="0">BPK / Runtime · 一次 Running 实例</tspan></text></g><g class="chip framework"><rect x="790" y="615" width="420" height="36" rx="3"/><text class="chip-title" x="801" y="631" text-anchor="start">Runtime：Service 声明 → HostBridge 准入</text></g><path class="edge strong" d="M290 317H340" marker-end="url(#arrow-strong)"/><path class="edge direct" d="M290 427H340" marker-end="url(#arrow-direct)"/><path class="edge direct" d="M290 532H340" marker-end="url(#arrow-direct)"/><path class="edge safe" d="M735 312H790" marker-end="url(#arrow-safe)"/><path class="edge safe" d="M735 397H790" marker-end="url(#arrow-safe)"/><path class="edge safe" d="M735 482H790" marker-end="url(#arrow-safe)"/><path class="edge safe" d="M735 567H790" marker-end="url(#arrow-safe)"/><text class="caption-strong" x="40" y="715" text-anchor="start">交点只为选定的真实能力建立：从 Owner 读 Context，向 Owner 交 Action，接收 Owner 的 Event。</text><text class="caption" x="40" y="739" text-anchor="start">Permission 贯穿每次访问；Runtime 仍须遵守 Brookesia Service 声明与 HostBridge 边界。</text></svg>
