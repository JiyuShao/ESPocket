<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 720"><title id="title">ESPocket 顶层导航 Surface</title><desc id="desc">CircularShell 的五个 Surface 围绕 Watch Face；App Root 和 Detail 由 System Core 管理，不属于 ShellSurface。</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="var(--grid)"/></pattern><marker id="arrow-direct" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-event" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-package" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>
  svg{--paper:#f3f6f9;--surface:#fff;--surface-soft:#f8fafc;--ink:#182b3d;--muted:#667b8e;--rule:#c7d2dc;--grid:rgba(48,78,103,.045);--blue:#1974c8;--blue-soft:#edf6ff;--teal:#178873;--teal-soft:#eef9f6;--amber:#a56d1d;--amber-soft:#fbf7ef;--danger:#b04f45;--danger-soft:#fdf1ef;--edge:#71879a;background:var(--paper);color-scheme:light}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:var(--ink)}
  .sheet{fill:var(--paper)}.grid{fill:url(#grid)}
  .doc-kicker{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.7px;fill:var(--blue)}
  .doc-title{font-size:28px;font-weight:600;letter-spacing:-.7px}.doc-subtitle{font-size:13px;fill:var(--muted)}
  .legend-text{font-size:11px;fill:var(--muted)}.legend-line{stroke:var(--edge);stroke-width:1.4}.legend-line.event{stroke-dasharray:5 5}.legend-line.package{stroke:var(--amber);stroke-dasharray:2 5}
  .band rect{fill:rgba(255,255,255,.86);stroke:var(--rule);stroke-width:1}.band.product rect{fill:rgba(237,246,255,.7);stroke:#a8c5de}.band.framework rect{fill:rgba(238,249,246,.78);stroke:#acd1c9}.band.platform rect{fill:rgba(251,247,239,.82);stroke:#d8c5a6}.band.danger rect{fill:var(--danger-soft);stroke:#dfb5b0}
  .band-title{font-size:15px;font-weight:600}.band-meta{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:var(--muted)}
  .node rect{fill:var(--surface);stroke:#aebdca;stroke-width:1}.node.product rect{fill:var(--blue-soft);stroke:#79a8d1}.node.focus-product rect{fill:#e7f3ff;stroke:var(--blue);stroke-width:1.6}.node.framework rect{fill:var(--teal-soft);stroke:#7eb9ad}.node.focus-framework rect{fill:#e7f7f3;stroke:var(--teal);stroke-width:1.6}.node.platform rect{fill:var(--amber-soft);stroke:#c5a77a}.node.danger rect{fill:var(--danger-soft);stroke:#d79a94}
  .eyebrow{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.2px;fill:var(--muted)}.node-title{font-size:14px;font-weight:600}.detail{font:400 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}
  .chip rect{fill:var(--surface);stroke:#b6c4cf;stroke-width:1}.chip.product rect{fill:var(--blue-soft);stroke:#91b5d5}.chip.framework rect{fill:var(--teal-soft);stroke:#8ebeb5}.chip.platform rect{fill:var(--amber-soft);stroke:#c8ae85}.chip.danger rect{fill:var(--danger-soft);stroke:#d5a39e}.chip-title{font-size:11px;font-weight:600}.chip-meta{font:400 9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}
  .edge{fill:none;stroke:var(--edge);stroke-width:1.35}.edge.direct{marker-end:url(#arrow-direct)}.edge.event{stroke-dasharray:5 5;marker-end:url(#arrow-event)}.edge.package{stroke:var(--amber);stroke-dasharray:2 5;marker-end:url(#arrow-package)}.edge.strong{stroke:var(--blue);stroke-width:1.65;marker-end:url(#arrow-strong)}.edge.safe{stroke:var(--teal);marker-end:url(#arrow-safe)}.edge.fail{stroke:var(--danger);stroke-dasharray:5 5;marker-end:url(#arrow-fail)}
  .edge-text{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}.edge-text.package{fill:var(--amber)}.edge-text.strong{fill:var(--blue)}.edge-text.safe{fill:var(--teal)}.edge-text.fail{fill:var(--danger)}
  .lane{stroke:#b9c6d0;stroke-width:1;stroke-dasharray:3 5}.lane-head rect{fill:var(--surface);stroke:var(--rule)}.lane-head.product rect{fill:var(--blue-soft);stroke:#91b5d5}.lane-head.framework rect{fill:var(--teal-soft);stroke:#8ebeb5}.lane-title{font-size:12px;font-weight:600}
  .step rect{fill:var(--surface);stroke:#aebdca}.step.product rect{fill:var(--blue-soft);stroke:#79a8d1}.step.framework rect{fill:var(--teal-soft);stroke:#7eb9ad}.step.platform rect{fill:var(--amber-soft);stroke:#c5a77a}.step-num{font:500 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:var(--muted)}.step-title{font-size:12px;font-weight:600}.step-detail{font:400 9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}
  .section{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.4px;fill:var(--muted)}.caption{font-size:11px;fill:var(--muted)}.caption-strong{font-size:11px;font-weight:600;fill:var(--ink)}
  .state{fill:var(--surface);stroke:#aebdca;stroke-width:1.2}.state.product{fill:var(--blue-soft);stroke:var(--blue)}.state.framework{fill:var(--teal-soft);stroke:var(--teal)}.state.platform{fill:var(--amber-soft);stroke:var(--amber)}.state-title{font-size:14px;font-weight:600}.state-detail{font-size:10px;fill:var(--muted)}
</style><rect class="sheet" width="1200" height="720"/><rect class="grid" width="1200" height="720"/><text class="doc-kicker" x="40" y="34" text-anchor="start">ESPOCKET · ARCHITECTURE</text><text class="doc-title" x="40" y="67" text-anchor="start">ESPocket 顶层导航 Surface</text><text class="doc-subtitle" x="40" y="91" text-anchor="start">Watch Face 是 Home 锚点；前台 App 不属于 ShellSurface</text><g aria-label="连线图例"><line class="legend-line" x1="870" y1="62" x2="894" y2="62"/><text class="legend-text" x="902" y="66" text-anchor="start">调用 / 依赖</text><line class="legend-line event" x1="986" y1="62" x2="1010" y2="62"/><text class="legend-text" x="1018" y="66" text-anchor="start">事件</text><line class="legend-line package" x1="1072" y1="62" x2="1096" y2="62"/><text class="legend-text" x="1104" y="66" text-anchor="start">包加载</text></g><text class="section" x="600" y="128" text-anchor="middle">SHELL SURFACES</text><circle class="state product" cx="600" cy="342" r="92"/><text class="state-title" x="600" y="334" text-anchor="middle">Watch Face</text><text class="state-detail" x="600" y="354" text-anchor="middle">HOME ANCHOR</text><rect class="state product" x="475" y="145" width="250" height="72" rx="4"/><text class="state-title" x="600" y="176" text-anchor="middle">Quick Settings</text><text class="state-detail" x="600" y="196" text-anchor="middle">下滑进入 · 上滑返回</text><rect class="state product" x="475" y="493" width="250" height="72" rx="4"/><text class="state-title" x="600" y="524" text-anchor="middle">Launcher</text><text class="state-detail" x="600" y="544" text-anchor="middle">上滑进入 · 选择 App</text><rect class="state product" x="120" y="306" width="235" height="72" rx="4"/><text class="state-title" x="237" y="337" text-anchor="middle">Battery Card</text><text class="state-detail" x="237" y="357" text-anchor="middle">水平滑动</text><rect class="state product" x="845" y="306" width="235" height="72" rx="4"/><text class="state-title" x="962" y="337" text-anchor="middle">Brightness Card</text><text class="state-detail" x="962" y="357" text-anchor="middle">水平滑动</text><g class="band neutral"><rect x="780" y="480" width="350" height="145" rx="6"/><text class="band-title" x="798" y="506" text-anchor="start">Foreground App</text><text class="band-meta" x="798" y="524" text-anchor="start">NOT A SHELL SURFACE</text></g><g class="chip neutral"><rect x="805" y="528" width="140" height="36" rx="3"/><text class="chip-title" x="816" y="544" text-anchor="start">App Root</text><text class="chip-meta" x="816" y="557" text-anchor="start">no Back</text></g><g class="chip neutral"><rect x="965" y="528" width="140" height="36" rx="3"/><text class="chip-title" x="976" y="544" text-anchor="start">App Detail</text><text class="chip-meta" x="976" y="557" text-anchor="start">Edge Back → Root</text></g><path class="edge direct" d="M600 250V217" marker-end="url(#arrow-direct)"/><text class="edge-text direct" x="612" y="240" text-anchor="start">swipe down</text><path class="edge direct" d="M600 434V493" marker-end="url(#arrow-direct)"/><text class="edge-text direct" x="612" y="470" text-anchor="start">swipe up</text><path class="edge direct" d="M508 342H355" marker-end="url(#arrow-direct)"/><text class="edge-text direct" x="397" y="332" text-anchor="start">horizontal</text><path class="edge direct" d="M692 342H845" marker-end="url(#arrow-direct)"/><text class="edge-text direct" x="721" y="332" text-anchor="start">horizontal</text><path class="edge strong" d="M725 529H780" marker-end="url(#arrow-strong)"/><text class="edge-text strong" x="733" y="519" text-anchor="start">launch</text><path class="edge event" d="M955 480V430H692" marker-end="url(#arrow-event)"/><text class="edge-text event" x="802" y="421" text-anchor="start">PWR Home</text><text class="caption-strong" x="120" y="636" text-anchor="start">PWR Home</text><text class="caption" x="190" y="636" text-anchor="start">任何非 Home 状态最终回到 Watch Face</text><text class="caption-strong" x="120" y="660" text-anchor="start">Screen Off</text><text class="caption" x="190" y="660" text-anchor="start">与导航状态正交，不执行 Back</text></svg>
