<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 1200 690"><title id="title">ESPocket App 生命周期</title><desc id="desc">App 从 Shell 回调进入 espocket::System，再由 System Core 统一启动或停止；PWR Home 返回 Watch Face。</desc><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="var(--grid)"/></pattern><marker id="arrow-direct" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-event" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-package" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-strong" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-safe" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker><marker id="arrow-fail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><style>
  svg{--paper:#f3f6f9;--surface:#fff;--surface-soft:#f8fafc;--ink:#182b3d;--muted:#667b8e;--rule:#c7d2dc;--grid:rgba(48,78,103,.045);--blue:#1974c8;--blue-soft:#edf6ff;--teal:#178873;--teal-soft:#eef9f6;--amber:#a56d1d;--amber-soft:#fbf7ef;--danger:#b04f45;--danger-soft:#fdf1ef;--edge:#71879a;background:var(--paper);color-scheme:light}
  text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;fill:var(--ink)}
  .sheet{fill:var(--paper)}.grid{fill:url(#grid)}
  .doc-kicker{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.7px;fill:var(--blue)}
  .doc-title{font-size:28px;font-weight:600;letter-spacing:-.7px}.doc-subtitle{font-size:13px;fill:var(--muted)}
  .legend-text{font-size:11px;fill:var(--muted)}.legend-line{stroke:var(--edge);stroke-width:1.4}.legend-line.event{stroke-dasharray:5 5}.legend-line.package{stroke:var(--amber);stroke-dasharray:2 5}
  .band rect{fill:rgba(255,255,255,.86);stroke:var(--rule);stroke-width:1}.band.product rect{fill:rgba(237,246,255,.7);stroke:#a8c5de}.band.framework rect{fill:rgba(238,249,246,.78);stroke:#acd1c9}.band.platform rect{fill:rgba(251,247,239,.82);stroke:#d8c5a6}.band.danger rect{fill:var(--danger-soft);stroke:#dfb5b0}
  .band-title{font-size:15px;font-weight:600}.band-meta{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:var(--muted)}
  .node rect{fill:var(--surface);stroke:#aebdca;stroke-width:1}.node.product rect{fill:var(--blue-soft);stroke:#79a8d1}.node.focus-product rect{fill:#e7f3ff;stroke:var(--blue);stroke-width:1.6}.node.framework rect{fill:var(--teal-soft);stroke:#7eb9ad}.node.focus-framework rect{fill:#e7f7f3;stroke:var(--teal);stroke-width:1.6}.node.platform rect{fill:var(--amber-soft);stroke:#c5a77a}.node.danger rect{fill:var(--danger-soft);stroke:#d79a94}
  .eyebrow{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.2px;fill:var(--muted)}.node-title{font-size:14px;font-weight:600}.detail{font:400 11px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}
  .chip rect{fill:var(--surface);stroke:#b6c4cf;stroke-width:1}.chip.product rect{fill:var(--blue-soft);stroke:#91b5d5}.chip.framework rect{fill:var(--teal-soft);stroke:#8ebeb5}.chip.platform rect{fill:var(--amber-soft);stroke:#c8ae85}.chip.danger rect{fill:var(--danger-soft);stroke:#d5a39e}.chip-title{font-size:11px;font-weight:600}.chip-meta{font:400 9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}
  .edge{fill:none;stroke:var(--edge);stroke-width:1.35}.edge.direct{marker-end:url(#arrow-direct)}.edge.event{stroke-dasharray:5 5;marker-end:url(#arrow-event)}.edge.package{stroke:var(--amber);stroke-dasharray:2 5;marker-end:url(#arrow-package)}.edge.strong{stroke:var(--blue);stroke-width:1.65;marker-end:url(#arrow-strong)}.edge.safe{stroke:var(--teal);marker-end:url(#arrow-safe)}.edge.fail{stroke:var(--danger);stroke-dasharray:5 5;marker-end:url(#arrow-fail)}
  .edge-text{font:500 10px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}.edge-text.package{fill:var(--amber)}.edge-text.strong{fill:var(--blue)}.edge-text.safe{fill:var(--teal)}.edge-text.fail{fill:var(--danger)}
  .lane{stroke:#b9c6d0;stroke-width:1;stroke-dasharray:3 5}.lane-head rect{fill:var(--surface);stroke:var(--rule)}.lane-head.product rect{fill:var(--blue-soft);stroke:#91b5d5}.lane-head.framework rect{fill:var(--teal-soft);stroke:#8ebeb5}.lane-title{font-size:12px;font-weight:600}
  .step rect{fill:var(--surface);stroke:#aebdca}.step.product rect{fill:var(--blue-soft);stroke:#79a8d1}.step.framework rect{fill:var(--teal-soft);stroke:#7eb9ad}.step.platform rect{fill:var(--amber-soft);stroke:#c5a77a}.step-num{font:500 9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;fill:var(--muted)}.step-title{font-size:12px;font-weight:600}.step-detail{font:400 9px ui-monospace,SFMono-Regular,Menlo,monospace;fill:var(--muted)}
  .section{font:500 11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.4px;fill:var(--muted)}.caption{font-size:11px;fill:var(--muted)}.caption-strong{font-size:11px;font-weight:600;fill:var(--ink)}
  .state{fill:var(--surface);stroke:#aebdca;stroke-width:1.2}.state.product{fill:var(--blue-soft);stroke:var(--blue)}.state.framework{fill:var(--teal-soft);stroke:var(--teal)}.state.platform{fill:var(--amber-soft);stroke:var(--amber)}.state-title{font-size:14px;font-weight:600}.state-detail{font-size:10px;fill:var(--muted)}
</style><rect class="sheet" width="1200" height="690"/><rect class="grid" width="1200" height="690"/><text class="doc-kicker" x="40" y="34" text-anchor="start">ESPOCKET · ARCHITECTURE</text><text class="doc-title" x="40" y="67" text-anchor="start">ESPocket App 生命周期</text><text class="doc-subtitle" x="40" y="91" text-anchor="start">Shell 发起、System Core 执行、PWR Home 返回表盘</text><g aria-label="连线图例"><line class="legend-line" x1="870" y1="62" x2="894" y2="62"/><text class="legend-text" x="902" y="66" text-anchor="start">调用 / 依赖</text><line class="legend-line event" x1="986" y1="62" x2="1010" y2="62"/><text class="legend-text" x="1018" y="66" text-anchor="start">事件</text><line class="legend-line package" x1="1072" y1="62" x2="1096" y2="62"/><text class="legend-text" x="1104" y="66" text-anchor="start">包加载</text></g><line class="lane" x1="120" y1="118" x2="120" y2="620"/><g class="lane-head product"><rect x="42" y="108" width="156" height="34" rx="3"/><text class="lane-title" x="120" y="130" text-anchor="middle">CircularShell</text></g><line class="lane" x1="360" y1="118" x2="360" y2="620"/><g class="lane-head product"><rect x="282" y="108" width="156" height="34" rx="3"/><text class="lane-title" x="360" y="130" text-anchor="middle">espocket::System</text></g><line class="lane" x1="620" y1="118" x2="620" y2="620"/><g class="lane-head framework"><rect x="542" y="108" width="156" height="34" rx="3"/><text class="lane-title" x="620" y="130" text-anchor="middle">System Core</text></g><line class="lane" x1="870" y1="118" x2="870" y2="620"/><g class="lane-head neutral"><rect x="792" y="108" width="156" height="34" rx="3"/><text class="lane-title" x="870" y="130" text-anchor="middle">App instance</text></g><line class="lane" x1="1080" y1="118" x2="1080" y2="620"/><g class="lane-head product"><rect x="1002" y="108" width="156" height="34" rx="3"/><text class="lane-title" x="1080" y="130" text-anchor="middle">CircularShell</text></g><g class="step product"><rect x="48" y="140" width="144" height="68" rx="4"/><text class="step-num" x="61" y="159" text-anchor="start">01</text><text class="step-title" x="61" y="180" text-anchor="start">选择 App</text><text class="step-detail" x="61" y="197" text-anchor="start">root or target</text></g><g class="step product"><rect x="288" y="220" width="144" height="68" rx="4"/><text class="step-num" x="301" y="239" text-anchor="start">02</text><text class="step-title" x="301" y="260" text-anchor="start">launch_app</text><text class="step-detail" x="301" y="277" text-anchor="start">manifest → app_id</text></g><g class="step framework"><rect x="548" y="300" width="144" height="68" rx="4"/><text class="step-num" x="561" y="319" text-anchor="start">03</text><text class="step-title" x="561" y="340" text-anchor="start">start_app</text><text class="step-detail" x="561" y="357" text-anchor="start">state + GUI / runtime</text></g><g class="step neutral"><rect x="798" y="380" width="144" height="68" rx="4"/><text class="step-num" x="811" y="399" text-anchor="start">04</text><text class="step-title" x="811" y="420" text-anchor="start">on_start</text><text class="step-detail" x="811" y="437" text-anchor="start">Native or Runtime</text></g><g class="step framework"><rect x="548" y="460" width="144" height="68" rx="4"/><text class="step-num" x="561" y="479" text-anchor="start">05</text><text class="step-title" x="561" y="500" text-anchor="start">stop_app</text><text class="step-detail" x="561" y="517" text-anchor="start">PWR Home</text></g><g class="step product"><rect x="288" y="540" width="144" height="68" rx="4"/><text class="step-num" x="301" y="559" text-anchor="start">06</text><text class="step-title" x="301" y="580" text-anchor="start">lifecycle hook</text><text class="step-detail" x="301" y="597" text-anchor="start">clear foreground</text></g><g class="step product"><rect x="1008" y="540" width="144" height="68" rx="4"/><text class="step-num" x="1021" y="559" text-anchor="start">07</text><text class="step-title" x="1021" y="580" text-anchor="start">show Watch Face</text><text class="step-detail" x="1021" y="597" text-anchor="start">clear Page stack</text></g><path class="edge strong" d="M192 174H240V254H288" marker-end="url(#arrow-strong)"/><path class="edge strong" d="M432 254H488V334H548" marker-end="url(#arrow-strong)"/><path class="edge safe" d="M692 334H742V414H798" marker-end="url(#arrow-safe)"/><path class="edge event" d="M798 414H742V494H692" marker-end="url(#arrow-event)"/><path class="edge event" d="M548 494H490V574H432" marker-end="url(#arrow-event)"/><path class="edge strong" d="M432 574H1008" marker-end="url(#arrow-strong)"/><text class="edge-text strong" x="660" y="565" text-anchor="start">PWR Home</text><text class="caption-strong" x="48" y="655" text-anchor="start">Native 与 Runtime 的加载实现不同，但状态机、前台跟踪与 Home 相同。</text></svg>
